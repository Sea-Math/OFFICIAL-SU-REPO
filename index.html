
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Bean</title>
    <link rel="icon" type="image/jpeg" href="mathpunch.jpeg" />
    <script
      defer
      data-domain="math-punch"
      src="https://stats.senty.com.au/js/script.outbound-links.pageview-props.tagged-events.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(window.plausible.q = window.plausible.q || []).push(arguments)
        }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Product+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script type="module" src="su-client.js"></script>
    <script type="module" src="su-canvas.js"></script>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f1f3f4;
        --bg-tertiary: #e8eaed;
        --accent: #1a73e8;
        --accent-bright: #4285f4;
        --accent-dim: rgba(26, 115, 232, 0.1);
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --text-muted: #9aa0a6;
        --border: #dadce0;
        --shadow: rgba(32, 33, 36, 0.1);
        --shadow-hover: rgba(32, 33, 36, 0.28);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }

      body {
        font-family: 'Roboto', Arial, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── LOADING ── */
      .loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--bg-tertiary);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── TOP BAR (Tab Strip) ── */
      .top-bar {
        background: #dee1e6;
        display: flex;
        flex-direction: column;
        padding-top: 6px;
        z-index: 100;
      }

      .tabs-container {
        display: flex;
        align-items: flex-end;
        padding: 0 8px;
        gap: 2px;
        overflow-x: auto;
      }

      .tab {
        background: transparent;
        padding: 8px 12px;
        border-radius: 8px 8px 0 0;
        font-size: 0.75rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 120px;
        max-width: 240px;
        color: var(--text-secondary);
        transition: background 0.2s;
        position: relative;
      }

      .tab:hover:not(.active) {
        background: #e4e6e9;
      }

      .tab.active {
        background: var(--bg-primary);
        color: var(--text-primary);
        z-index: 2;
      }

      /* Separator line between inactive tabs */
      .tab:not(.active) + .tab:not(.active)::before {
        content: '';
        position: absolute;
        left: -1px;
        top: 20%;
        height: 60%;
        width: 1px;
        background: #8e9196;
      }

      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .close-tab {
        color: var(--text-secondary);
        font-size: 16px;
        width: 16px; height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: background 0.2s;
        line-height: 1;
      }
      .close-tab:hover {
        background: #d3d3d3;
      }

      .new-tab-btn {
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: 18px;
        margin-left: 4px;
        transition: background 0.2s;
      }
      .new-tab-btn:hover { background: #d0d3d8; }

      /* ── TOOLBAR ── */
      .toolbar {
        background: var(--bg-primary);
        padding: 6px 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }

      .nav-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        width: 32px; height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }
      .nav-btn:hover {
        background: var(--bg-secondary);
      }
      .nav-btn:disabled { opacity: 0.4; }

      .url-bar { flex: 1; position: relative; }

      .url-bar input {
        width: 100%;
        padding: 8px 16px;
        padding-right: 35px;
        background: var(--bg-secondary);
        border: 1px solid transparent;
        border-radius: 999px; /* Pill shape */
        color: var(--text-primary);
        font-family: 'Roboto', sans-serif;
        font-size: 0.85rem;
        outline: none;
        transition: background 0.2s, box-shadow 0.2s, border 0.2s;
      }
      .url-bar input:hover {
        background: #e8eaed;
      }
      .url-bar input:focus {
        background: var(--bg-primary);
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .url-bar input::placeholder { color: var(--text-muted); }

      .spinner-icon {
        position: absolute;
        right: 12px; top: 50%;
        margin-top: -7px;
        width: 14px; height: 14px;
        border: 2px solid var(--bg-tertiary);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        pointer-events: none;
      }

      .tab-icon-area {
        width: 16px; height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      /* ── CONTENT ── */
      .content-area {
        flex: 1;
        background: var(--bg-primary);
        overflow: hidden;
        position: relative;
        display: flex;
      }

      .tab-transition {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: var(--bg-primary);
        z-index: 100;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .tab-transition.active { opacity: 1; }

      #canvas-container {
        width: 100%; height: 100%;
        flex: 1;
        background: white;
      }
      #canvas-container iframe {
        display: block;
        width: 100%; height: 100%;
        border: none;
      }

      /* ── HOME / NEW TAB ── */
      .empty-state {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 15vh;
        background: var(--bg-primary);
        overflow-y: auto;
        z-index: 10;
      }

      /* Logo */
      .logo-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 30px;
      }

      .main-logo {
        font-family: 'Product Sans', 'Roboto', sans-serif;
        font-size: 4.5rem;
        font-weight: 400;
        letter-spacing: -2px;
        color: var(--text-primary);
      }
      
      /* Multi-color effect to mimic Google */
      .main-logo span:nth-child(1) { color: #4285f4; }
      .main-logo span:nth-child(2) { color: #ea4335; }
      .main-logo span:nth-child(3) { color: #fbbc05; }
      .main-logo span:nth-child(4) { color: #4285f4; }
      .main-logo span:nth-child(5) { color: #34a853; }
      .main-logo span:nth-child(6) { color: #ea4335; }
      .main-logo span:nth-child(7) { color: #4285f4; }

      .version-tag {
        font-family: 'Roboto', sans-serif;
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 5px;
      }

      /* Search */
      .search-container {
        width: 100%;
        max-width: 580px;
        margin-bottom: 40px;
        position: relative;
        padding: 0 20px;
      }

      .search-container input {
        width: 100%;
        padding: 14px 24px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 24px;
        color: var(--text-primary);
        font-family: 'Roboto', sans-serif;
        font-size: 1rem;
        outline: none;
        transition: box-shadow 0.2s, border 0.2s;
      }
      .search-container input:hover {
        box-shadow: 0 1px 6px var(--shadow);
      }
      .search-container input:focus {
        border-color: transparent;
        box-shadow: 0 1px 6px var(--shadow-hover);
      }
      .search-container input::placeholder { color: var(--text-muted); }

      /* Quick Apps */
      .quick-apps-section {
        width: 100%;
        max-width: 580px;
        padding: 0 20px;
      }

      .section-header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 10px;
      }

      .edit-btn {
        background: transparent;
        border: none;
        color: var(--accent);
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.2s;
        font-family: 'Roboto', sans-serif;
      }
      .edit-btn:hover {
        background: var(--accent-dim);
      }

      .quick-apps-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 16px;
        justify-items: center;
      }

      .app-card {
        background: transparent;
        border-radius: 8px;
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        position: relative;
        width: 80px;
        transition: background 0.2s;
      }
      .app-card:hover {
        background: var(--bg-secondary);
      }

      .app-icon { 
        width: 48px; 
        height: 48px; 
        background: var(--bg-secondary);
        border-radius: 50%;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 10px;
      }
      .app-card:hover .app-icon {
        background: var(--bg-tertiary);
      }
      .app-icon img { width: 100%; height: 100%; object-fit: contain; }

      .app-name {
        font-size: 0.75rem;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
        text-align: center;
      }

      .card-actions {
        position: absolute;
        top: 0; right: 0;
        display: flex; gap: 4px;
      }

      .action-btn {
        width: 20px; height: 20px;
        border-radius: 50%;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .action-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }

      .add-card .app-icon {
        background: var(--bg-secondary);
        color: var(--text-secondary);
        font-size: 24px;
      }

      /* About:blank */
      .aboutblank-btn {
        margin-top: 40px;
        padding: 10px 20px;
        background: var(--bg-secondary);
        border: none;
        border-radius: 18px;
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        align-self: center;
        font-family: 'Roboto', sans-serif;
      }
      .aboutblank-btn:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }
      .aboutblank-btn svg { width: 16px; height: 16px; }

      /* Recent */
      .recent-section {
        width: 100%;
        max-width: 580px;
        padding: 0 20px;
        margin-top: 30px;
      }
      .recent-section h3 {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 12px;
      }

      .recent-list { display: flex; flex-direction: column; }

      .recent-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 16px;
        cursor: pointer;
        border-radius: 8px;
        transition: background 0.2s;
      }
      .recent-item:hover {
        background: var(--bg-secondary);
      }

      .recent-favicon { width: 16px; height: 16px; flex-shrink: 0; }
      .recent-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 2px;}
      .recent-title { font-size: 0.85rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .recent-url { font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .recent-remove {
        font-size: 18px; color: var(--text-muted);
        width: 24px; height: 24px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%; flex-shrink: 0;
        opacity: 0; transition: all 0.2s;
      }
      .recent-item:hover .recent-remove { opacity: 1; }
      .recent-remove:hover { background: var(--border); color: var(--text-primary); }

      /* Modal */
      .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.4);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000;
      }

      .modal {
        background: var(--bg-primary);
        border-radius: 8px;
        width: 100%; max-width: 400px;
        padding: 24px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      }

      .modal h4 {
        margin-bottom: 16px;
        font-weight: 500;
        font-size: 1.1rem;
        color: var(--text-primary);
      }

      .form-group { margin-bottom: 16px; }
      .form-group label {
        display: block; font-size: 0.8rem;
        color: var(--text-secondary); margin-bottom: 8px;
      }
      .form-group input {
        width: 100%; padding: 10px 12px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 4px; color: var(--text-primary);
        font-family: 'Roboto', sans-serif;
        outline: none; transition: border 0.2s;
      }
      .form-group input:focus {
        border-color: var(--accent);
      }

      .modal-footer {
        display: flex; justify-content: flex-end;
        gap: 8px; margin-top: 24px;
      }

      .btn {
        padding: 8px 16px; border-radius: 4px;
        cursor: pointer; font-size: 0.85rem; font-weight: 500;
        border: none; transition: background 0.2s;
        font-family: 'Roboto', sans-serif;
      }
      .btn-cancel {
        background: transparent; color: var(--accent);
      }
      .btn-cancel:hover { background: var(--accent-dim); }
      .btn-save {
        background: var(--accent); color: white;
      }
      .btn-save:hover {
        background: var(--accent-bright);
      }
    </style>
  </head>
  <body x-data="mathApp()">

    <div x-show="!ready" class="loading-overlay">
      <template x-if="!initError">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div class="spinner"></div>
          <p style="font-size:0.85rem;color:var(--text-secondary);" x-text="loadingStatus"></p>
        </div>
      </template>
      <template x-if="initError">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px;text-align:center;padding:20px;">
          <div style="font-size:2rem;">⚠️</div>
          <p style="color:var(--text-primary);font-size:0.9rem;" x-text="initError"></p>
          <button @click="forceReady()" style="padding:10px 24px;background:var(--accent);border:none;border-radius:4px;color:white;font-size:0.9rem;cursor:pointer;font-weight:500;">Continue Anyway</button>
          <button @click="location.reload()" style="padding:10px 24px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);font-size:0.9rem;cursor:pointer;">Reload Page</button>
        </div>
      </template>
    </div>

    <div class="top-bar" x-show="ready" style="display: none">
      <div class="tabs-container">
        <template x-for="tab in tabs" :key="tab.id">
          <div class="tab" :class="{ 'active': activeTabId === tab.id }" @click="activateTab(tab.id)">
            <div class="tab-icon-area">
              <template x-if="tab.loading">
                <div class="spinner" style="width:14px;height:14px;border-width:2px;margin:0;"></div>
              </template>
              <template x-if="!tab.loading">
                <img :src="tab.favicon || 'mathpunch.jpeg'" style="width:16px;height:16px;border-radius:2px;" onerror="this.onerror=null;this.src='mathpunch.jpeg'" />
              </template>
            </div>
            <span class="tab-title" x-text="tab.title || 'New Tab'"></span>
            <span class="close-tab" @click.stop="closeTab(tab.id)">×</span>
          </div>
        </template>
        <div class="new-tab-btn" @click="addTab()">+</div>
      </div>

      <div class="toolbar">
        <button class="nav-btn" @click="goBack()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <button class="nav-btn" @click="goForward()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
        <button class="nav-btn" @click="reloadTab()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
        <div class="url-bar">
          <form @submit.prevent="navigate(); $event.target.querySelector('input').blur()" style="margin: 0">
            <input type="text" x-model="currentUrlInput" placeholder="Search Google or type a URL" />
          </form>
          <div class="spinner-icon" x-show="isLoading"></div>
        </div>
      </div>
    </div>

    <div class="content-area" x-show="ready" style="display: none">
      <div class="tab-transition" :class="{ active: tabTransitioning }"></div>
      <div id="canvas-container"></div>

      <div class="empty-state" x-show="showNewTabUI">

        <div class="logo-group">
          <div class="main-logo">
            <span>S</span><span>e</span><span>a</span><span> </span><span>B</span><span>e</span><span>a</span><span>n</span>
          </div>
        </div>

        <div class="search-container">
          <form @submit.prevent="navigateFromHome(); $event.target.querySelector('input').blur()">
            <input type="text" x-model="homeSearchInput" placeholder="Search the web or type a URL" autofocus />
          </form>
        </div>

        <div class="quick-apps-section">
          <div class="section-header">
            <button class="edit-btn" @click="isEditingBookmarks = !isEditingBookmarks" x-text="isEditingBookmarks ? 'Done' : 'Edit Shortcuts'"></button>
          </div>
          <div class="quick-apps-grid">
            <template x-for="bm in bookmarks" :key="bm.id">
              <div class="app-card" @click="!isEditingBookmarks && (bm.url.startsWith('/') ? window.location.href = bm.url : navigateBookmark(bm.url))">
                <div class="app-icon">
                  <img :src="bm.icon || `https://www.google.com/s2/favicons?domain=${bm.url}&sz=64`" :alt="bm.name" onerror="this.onerror=null;this.src='mathpunch.jpeg'" />
                </div>
                <span class="app-name" x-text="bm.name"></span>
                <div class="card-actions" x-show="isEditingBookmarks">
                  <div class="action-btn edit" @click.stop="editBookmark(bm)">✎</div>
                  <div class="action-btn" @click.stop="removeBookmark(bm.id)">×</div>
                </div>
              </div>
            </template>
            <div class="app-card add-card" x-show="isEditingBookmarks" @click="openAddModal()">
              <div class="app-icon">+</div>
              <span class="app-name">Add shortcut</span>
            </div>
          </div>
        </div>

        <button class="aboutblank-btn" @click="openInAboutBlank()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Open in about:blank
        </button>

        <div class="recent-section" x-show="recentSites.length > 0">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Recent</h3>
            <button class="edit-btn" style="padding:0;" @click="clearRecent()">Clear</button>
          </div>
          <div class="recent-list">
            <template x-for="(site, index) in recentSites.slice(0, 5)" :key="index">
              <div class="recent-item" @click="navigateBookmark(site.url)">
                <img class="recent-favicon" :src="`https://www.google.com/s2/favicons?domain=${site.url}&sz=32`" onerror="this.onerror=null;this.style.opacity='0'" />
                <div class="recent-info">
                  <div class="recent-title" x-text="site.title || site.url"></div>
                  <div class="recent-url" x-text="site.url"></div>
                </div>
                <div class="recent-remove" @click.stop="removeRecent(index)">×</div>
              </div>
            </template>
          </div>
        </div>

      </div>
    </div>

    <div class="modal-overlay" x-show="showBookmarkModal" x-transition.opacity style="display: none">
      <div class="modal" @click.away="showBookmarkModal = false">
        <h4 x-text="bookmarkForm.id ? 'Edit shortcut' : 'Add shortcut'"></h4>
        <div class="form-group">
          <label>Name</label>
          <input type="text" x-model="bookmarkForm.name" placeholder="Name" />
        </div>
        <div class="form-group">
          <label>URL</label>
          <input type="text" x-model="bookmarkForm.url" placeholder="URL" />
        </div>
        <div class="form-group">
          <label>Icon URL (optional)</label>
          <input type="text" x-model="bookmarkForm.icon" placeholder="https://.../favicon.png" />
        </div>
        <div class="modal-footer">
          <button class="btn btn-cancel" @click="showBookmarkModal = false">Cancel</button>
          <button class="btn btn-save" @click="saveBookmark()">Done</button>
        </div>
      </div>
    </div>

    <script>
      function mathApp() {
        return {
          canvas: null,
          ready: false,
          error: null,
          initError: null,
          loadingStatus: 'Starting browser...',
          tabs: [],
          activeTabId: null,
          currentUrlInput: '',
          homeSearchInput: '',
          tabTransitioning: false,
          recentSites: [],
          bookmarks: [],
          isEditingBookmarks: false,
          showBookmarkModal: false,
          bookmarkForm: { id: null, name: '', url: '', icon: '' },

          get activeTab() { return this.tabs.find((t) => t.id === this.activeTabId) },
          get isLoading() { return this.activeTab ? this.activeTab.loading : false },
          get showNewTabUI() {
            if (!this.activeTab) return true
            return !this.activeTab.url || this.activeTab.url === 'about:blank' || this.activeTab.url.includes('/newtab.html')
          },

          forceReady() { this.ready = true },

          async init() {
            const timeout = setTimeout(() => {
              if (!this.ready) this.initError = 'Initialization timed out. The proxy files may be missing or blocked.'
            }, 8000)

            const defaults = [
              { id: 2, name: 'GitHub',      url: 'https://github.com' },
              { id: 3, name: 'CrazyGames',  url: 'https://crazygames.com' },
              { id: 6, name: 'Granite',     url: 'https://seabean.hollands.id.au/granite.html' },
              { id: 7, name: 'Shuttlemath', url: 'https://shuttlemath.com' },
              { id: 8, name: 'nowgg',       url: 'https://nowgg.fun' },
            ]

            const savedBookmarks = localStorage.getItem('seabean_bookmarks')
            if (savedBookmarks) {
              try {
                this.bookmarks = JSON.parse(savedBookmarks)
                  .filter(bm => ![1, 4, 5].includes(bm.id))
                  .map((bm) => {
                    if (bm.icon && bm.icon.includes('google.com/s2/favicons?domain=about:blank')) bm.icon = ''
                    const defaultBm = defaults.find((d) => d.id === bm.id)
                    if (defaultBm) return { ...bm, ...defaultBm }
                    return bm
                  })
                this.saveToStorage()
              } catch {
                this.bookmarks = defaults
                this.saveToStorage()
              }
            } else {
              this.bookmarks = defaults
              this.saveToStorage()
            }

            try {
              const savedRecent = localStorage.getItem('seabean_recent_sites')
              if (savedRecent) this.recentSites = JSON.parse(savedRecent)
            } catch { this.recentSites = [] }

            let SuCanvas, SuClient
            try {
              this.loadingStatus = 'Loading proxy engine...'
              const clientModule = await import('./su-client.js')
              const canvasModule = await import('./su-canvas.js')
              SuClient = clientModule.SuClient || window.SuClient
              SuCanvas = canvasModule.SuCanvas || window.SuCanvas
              if (!SuClient || !SuCanvas) throw new Error('SuClient or SuCanvas export missing')
            } catch (e) {
              clearTimeout(timeout)
              this.initError = 'Failed to load proxy files (su-canvas.js / su-client.js): ' + e.message
              return
            }

            try {
              this.loadingStatus = 'Starting proxy...'
              this.canvas = new SuCanvas('canvas-container')
            } catch (e) {
              clearTimeout(timeout)
              this.initError = 'Failed to initialize SuCanvas: ' + e.message
              return
            }

            this.canvas.on(SuCanvas.EVENTS.SURFACE_CREATED, () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.SURFACE_CLOSED,  () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.SURFACE_CHANGE, (s) => {
              this.activeTabId = s ? s.id : null
              if (s) this.updateFromSurface(s); else this.currentUrlInput = ''
            })
            this.canvas.on(SuCanvas.EVENTS.URL_CHANGE, (data) => {
              this.currentUrlInput = (data.decoded.includes('/newtab.html') || data.decoded === 'about:blank') ? '' : data.decoded
              this.refreshTabs()
            })
            this.canvas.on(SuCanvas.EVENTS.TITLE_CHANGE, () => {
              this.refreshTabs()
              const tab = this.activeTab
              if (tab && tab.url && tab.url !== 'about:blank' && !tab.url.includes('/newtab.html') && tab.title && tab.title !== 'New Tab') {
                this.addToRecent({ url: tab.url, title: tab.title })
              }
            })
            this.canvas.on(SuCanvas.EVENTS.FAVICON_CHANGE,  () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.LOADING_START,   () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.LOADING_STOP,    () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.READY, () => { clearTimeout(timeout); this.initError = null; this.ready = true })
            this.canvas.on(SuCanvas.EVENTS.ERROR, (e) => console.error('SuCanvas error:', e))

            try { this.addTab() } catch (e) {
              clearTimeout(timeout)
              this.initError = 'Failed to create initial tab: ' + e.message
            }
          },

          updateFromSurface(surface) {
            if (surface.client) {
              const decoded = surface.client.decode(surface.client._lastUrl || '')
              this.currentUrlInput = decoded === 'about:blank' ? '' : decoded
            }
          },

          refreshTabs() {
            this.tabs = Array.from(this.canvas.surfaces.values()).map((s) => {
              const client = s.client
              const rawUrl = client ? client._lastUrl || '' : ''
              const decoded = client ? client.decode(rawUrl) : ''
              return { id: s.id, title: s.title, favicon: s.favicon, loading: client ? client.getState().loading : false, url: decoded }
            })
            if (this.activeTab) {
              document.title = this.activeTab.title && this.activeTab.title !== 'New Tab'
                ? `${this.activeTab.title} - Sea Bean`
                : 'Sea Bean'
            }
          },

          saveToStorage() { localStorage.setItem('seabean_bookmarks', JSON.stringify(this.bookmarks)) },
          addTab()        { const id = this.canvas.createSurface(); this.canvas.switchSurface(id) },
          closeTab(id)    { this.canvas.closeSurface(id) },

          activateTab(id) {
            if (id === this.activeTabId) return
            this.tabTransitioning = true
            setTimeout(() => { this.canvas.switchSurface(id); setTimeout(() => { this.tabTransitioning = false }, 150) }, 150)
          },

          navigate()         { if (!this.currentUrlInput) return; this.canvas.navigate(this.currentUrlInput) },
          navigateFromHome() { if (!this.homeSearchInput) return; this.canvas.navigate(this.homeSearchInput); this.homeSearchInput = '' },
          navigateBookmark(url) { this.currentUrlInput = url; this.navigate() },
          reloadTab()        { this.canvas.reload() },
          goBack()           { this.canvas.goBack() },
          goForward()        { this.canvas.goForward() },

          addToRecent(site) {
            this.recentSites = this.recentSites.filter(s => s.url !== site.url)
            this.recentSites.unshift(site)
            if (this.recentSites.length > 10) this.recentSites = this.recentSites.slice(0, 10)
            localStorage.setItem('seabean_recent_sites', JSON.stringify(this.recentSites))
          },
          removeRecent(index) {
            this.recentSites.splice(index, 1)
            localStorage.setItem('seabean_recent_sites', JSON.stringify(this.recentSites))
          },
          clearRecent() { this.recentSites = []; localStorage.removeItem('seabean_recent_sites') },

          openInAboutBlank() {
            const win = window.open('about:blank', '_blank')
            if (!win) { alert('Popup blocked! Please allow popups for this site.'); return }
            win.document.title = 'Sea Bean'
            const iframe = win.document.createElement('iframe')
            iframe.style = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;'
            iframe.src = window.location.href
            win.document.body.style = 'margin:0;padding:0;overflow:hidden;'
            win.document.body.appendChild(iframe)
          },

          openAddModal()    { this.bookmarkForm = { id: null, name: '', url: '', icon: '' }; this.showBookmarkModal = true },
          editBookmark(bm)  { this.bookmarkForm = { ...bm }; this.showBookmarkModal = true },
          removeBookmark(id){ this.bookmarks = this.bookmarks.filter((b) => b.id !== id); this.saveToStorage() },

          saveBookmark() {
            if (!this.bookmarkForm.name || !this.bookmarkForm.url) return
            if (this.bookmarkForm.id) {
              const idx = this.bookmarks.findIndex((b) => b.id === this.bookmarkForm.id)
              this.bookmarks[idx] = { ...this.bookmarkForm }
            } else {
              this.bookmarks.push({ ...this.bookmarkForm, id: Date.now() })
            }
            this.saveToStorage()
            this.showBookmarkModal = false
          },
        }
      }
    </script>
  </body>
</html>
