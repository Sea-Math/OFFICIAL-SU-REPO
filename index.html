
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Bean</title>
    <link rel="icon" type="image/jpeg" href="mathpunch.jpeg" />
    <script
      defer
      data-domain="math-punch"
      src="https://stats.senty.com.au/js/script.outbound-links.pageview-props.tagged-events.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(window.plausible.q = window.plausible.q || []).push(arguments)
        }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script type="module" src="su-client.js"></script>
    <script type="module" src="su-canvas.js"></script>
    <style>
      :root {
        /* Premium Dark Sidebar Theme Variables */
        --bg-base: #09090b;
        --bg-sidebar: #18181b;
        --bg-surface: #27272a;
        --bg-surface-hover: #3f3f46;
        
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-dim: rgba(59, 130, 246, 0.15);
        
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        
        --border: #3f3f46;
        --border-light: rgba(255, 255, 255, 0.05);
        
        --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }

      /* ROW LAYOUT FOR SIDEBAR */
      body {
        font-family: 'Inter', -apple-system, sans-serif;
        background: var(--bg-base);
        color: var(--text-primary);
        display: flex;
        flex-direction: row;
        overflow: hidden;
        padding: 8px; /* Outer spacing for the floating effect */
        gap: 8px;
      }

      /* ── LOADING ── */
      .loading-overlay {
        position: fixed; inset: 0;
        background: var(--bg-base);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 2000;
      }
      .spinner {
        width: 36px; height: 36px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        margin-bottom: 20px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── SIDEBAR (Left) ── */
      .sidebar {
        width: 260px;
        min-width: 260px;
        background: var(--bg-sidebar);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-lg);
        z-index: 100;
        overflow: hidden;
      }

      /* Brand Header */
      .sidebar-header {
        padding: 20px 16px 12px;
        font-weight: 700;
        font-size: 1.2rem;
        letter-spacing: -0.5px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sidebar-header .dot {
        width: 8px; height: 8px;
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent);
      }

      /* Toolbar in Sidebar */
      .toolbar {
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-bottom: 1px solid var(--border-light);
      }

      .url-bar { position: relative; width: 100%; }
      .url-bar input {
        width: 100%;
        padding: 10px 14px;
        padding-right: 32px;
        background: var(--bg-base);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        outline: none;
        transition: all 0.2s;
      }
      .url-bar input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-dim);
      }
      .url-bar input::placeholder { color: var(--text-muted); }

      .spinner-icon {
        position: absolute; right: 12px; top: 50%;
        transform: translateY(-50%);
        width: 14px; height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        pointer-events: none;
      }

      .nav-row {
        display: flex;
        gap: 6px;
        justify-content: space-between;
      }
      .nav-btn {
        flex: 1;
        background: var(--bg-surface);
        border: 1px solid var(--border-light);
        color: var(--text-secondary);
        cursor: pointer;
        height: 32px;
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s;
      }
      .nav-btn:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
      .nav-btn.new-tab-btn { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
      .nav-btn.new-tab-btn:hover { background: var(--accent); color: #fff; }

      /* Vertical Tabs */
      .tabs-container {
        flex: 1;
        overflow-y: auto;
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .tabs-container::-webkit-scrollbar { width: 4px; }
      .tabs-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

      .tab {
        background: transparent;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        cursor: pointer;
        display: flex; align-items: center; gap: 10px;
        color: var(--text-secondary);
        transition: all 0.2s;
        border: 1px solid transparent;
      }
      .tab:hover:not(.active) { background: var(--bg-surface); color: var(--text-primary); }
      .tab.active {
        background: var(--bg-surface);
        color: var(--text-primary);
        border-color: var(--border-light);
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }

      .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-weight: 500; }
      .tab-icon-area { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
      
      .close-tab {
        color: var(--text-muted);
        width: 20px; height: 20px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 4px; opacity: 0;
        transition: all 0.2s;
      }
      .tab:hover .close-tab, .tab.active .close-tab { opacity: 1; }
      .close-tab:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

      /* ── MAIN CONTENT (Right) ── */
      .content-area {
        flex: 1;
        background: #ffffff; /* Default white for sites to render properly */
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        display: flex;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border-light);
      }

      .tab-transition {
        position: absolute; inset: 0;
        background: var(--bg-base);
        z-index: 100; pointer-events: none;
        opacity: 0; transition: opacity 0.15s ease;
      }
      .tab-transition.active { opacity: 1; }

      #canvas-container { width: 100%; height: 100%; flex: 1; }
      #canvas-container iframe { display: block; width: 100%; height: 100%; border: none; }

      /* ── HOME / NEW TAB (Inside Content Area) ── */
      .empty-state {
        position: absolute; inset: 0;
        background: var(--bg-sidebar); /* Dark theme for start page */
        display: flex; flex-direction: column; align-items: center;
        padding-top: 12vh; overflow-y: auto; z-index: 10;
      }

      .main-logo {
        font-size: 3.5rem; font-weight: 700; letter-spacing: -1px;
        color: var(--text-primary); margin-bottom: 40px;
      }
      .main-logo span { color: var(--accent); }

      .search-container { width: 100%; max-width: 580px; margin-bottom: 50px; padding: 0 20px; }
      .search-container input {
        width: 100%; padding: 16px 24px;
        background: var(--bg-base); border: 1px solid var(--border);
        border-radius: 12px; color: var(--text-primary);
        font-family: 'Inter', sans-serif; font-size: 1rem;
        outline: none; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .search-container input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

      .quick-apps-section { width: 100%; max-width: 580px; padding: 0 20px; }
      .section-header { display: flex; justify-content: flex-end; margin-bottom: 12px; }
      
      .edit-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.85rem; transition: color 0.2s; }
      .edit-btn:hover { color: var(--text-primary); }

      .quick-apps-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 16px; justify-items: center;
      }
      .app-card {
        background: transparent; border-radius: 12px; padding: 12px 8px;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        cursor: pointer; position: relative; width: 85px; transition: all 0.2s;
      }
      .app-card:hover { background: var(--bg-surface); transform: translateY(-2px); }

      .app-icon { 
        width: 52px; height: 52px; background: var(--bg-surface);
        border-radius: 12px; border: 1px solid var(--border-light);
        display: flex; align-items: center; justify-content: center; padding: 12px;
      }
      .app-card:hover .app-icon { background: var(--bg-surface-hover); }
      .app-icon img { width: 100%; height: 100%; object-fit: contain; }
      .app-name { font-size: 0.75rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }

      .card-actions { position: absolute; top: 0; right: 0; display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
      .app-card:hover .card-actions { opacity: 1; }
      .action-btn {
        width: 22px; height: 22px; border-radius: 50%; background: var(--bg-surface-hover); border: 1px solid var(--border);
        color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer;
      }
      .action-btn:hover { background: var(--accent); border-color: var(--accent); }

      .add-card .app-icon { background: transparent; border: 1px dashed var(--border); color: var(--text-secondary); font-size: 24px; }
      .add-card:hover .app-icon { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

      .aboutblank-btn {
        margin-top: 40px; padding: 12px 24px; background: var(--bg-surface); border: 1px solid var(--border-light);
        border-radius: 12px; color: var(--text-primary); font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
        display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .aboutblank-btn:hover { background: var(--bg-surface-hover); transform: translateY(-1px); }
      .aboutblank-btn svg { width: 16px; height: 16px; color: var(--text-secondary); }

      /* Recent List */
      .recent-section { width: 100%; max-width: 580px; padding: 0 20px; margin-top: 40px; padding-bottom: 40px; }
      .recent-section h3 { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;}
      .recent-list { display: flex; flex-direction: column; gap: 6px; }
      .recent-item { display: flex; align-items: center; gap: 16px; padding: 12px; cursor: pointer; border-radius: 8px; transition: background 0.2s; border: 1px solid transparent; }
      .recent-item:hover { background: var(--bg-surface); border-color: var(--border-light); }
      .recent-favicon { width: 20px; height: 20px; border-radius: 4px; }
      .recent-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
      .recent-title { font-size: 0.85rem; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .recent-url { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .recent-remove { color: var(--text-muted); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 6px; opacity: 0; transition: all 0.2s; }
      .recent-item:hover .recent-remove { opacity: 1; }
      .recent-remove:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

      /* Modals */
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
      .modal { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 12px; width: 100%; max-width: 400px; padding: 24px; box-shadow: var(--shadow-lg); }
      .modal h4 { margin-bottom: 20px; font-weight: 600; font-size: 1.1rem; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
      .form-group input { width: 100%; padding: 10px 14px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: 'Inter', sans-serif; outline: none; transition: border 0.2s; }
      .form-group input:focus { border-color: var(--accent); }
      .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
      .btn { padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; border: none; transition: all 0.2s; }
      .btn-cancel { background: transparent; color: var(--text-secondary); }
      .btn-cancel:hover { background: var(--bg-surface-hover); color: var(--text-primary); }
      .btn-save { background: var(--accent); color: white; }
      .btn-save:hover { background: var(--accent-hover); }
    </style>
  </head>
  <body x-data="mathApp()">

    <div x-show="!ready" class="loading-overlay">
      <template x-if="!initError">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div class="spinner"></div>
          <p style="font-size:0.9rem;color:var(--text-secondary);font-weight:500;" x-text="loadingStatus"></p>
        </div>
      </template>
      <template x-if="initError">
        <div style="display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px;text-align:center;padding:20px;">
          <div style="font-size:2rem;">⚠️</div>
          <p style="color:var(--text-primary);font-size:0.9rem;" x-text="initError"></p>
          <button @click="forceReady()" style="padding:10px 24px;background:var(--accent);border:none;border-radius:6px;color:white;font-size:0.9rem;cursor:pointer;font-weight:500;">Continue Anyway</button>
          <button @click="location.reload()" style="padding:10px 24px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:0.9rem;cursor:pointer;">Reload Page</button>
        </div>
      </template>
    </div>

    <div class="sidebar" x-show="ready" style="display: none">
      <div class="sidebar-header">
        <div class="dot"></div>
        Sea Bean
      </div>

      <div class="toolbar">
        <div class="url-bar">
          <form @submit.prevent="navigate(); $event.target.querySelector('input').blur()" style="margin: 0">
            <input type="text" x-model="currentUrlInput" placeholder="Search or enter URL..." />
          </form>
          <div class="spinner-icon" x-show="isLoading"></div>
        </div>
        <div class="nav-row">
          <button class="nav-btn" @click="goBack()" title="Back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
          </button>
          <button class="nav-btn" @click="goForward()" title="Forward">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
          <button class="nav-btn" @click="reloadTab()" title="Reload">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
          <button class="nav-btn new-tab-btn" @click="addTab()" title="New Tab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="tabs-container">
        <template x-for="tab in tabs" :key="tab.id">
          <div class="tab" :class="{ 'active': activeTabId === tab.id }" @click="activateTab(tab.id)">
            <div class="tab-icon-area">
              <template x-if="tab.loading">
                <div class="spinner" style="width:14px;height:14px;border-width:2px;margin:0;"></div>
              </template>
              <template x-if="!tab.loading">
                <img :src="tab.favicon || 'mathpunch.jpeg'" style="width:16px;height:16px;border-radius:4px;" onerror="this.onerror=null;this.src='mathpunch.jpeg'" />
              </template>
            </div>
            <span class="tab-title" x-text="tab.title || 'New Tab'"></span>
            <span class="close-tab" @click.stop="closeTab(tab.id)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </span>
          </div>
        </template>
      </div>
    </div>

    <div class="content-area" x-show="ready" style="display: none">
      <div class="tab-transition" :class="{ active: tabTransitioning }"></div>
      <div id="canvas-container"></div>

      <div class="empty-state" x-show="showNewTabUI">
        <div class="main-logo">
          Sea <span>Bean</span>
        </div>

        <div class="search-container">
          <form @submit.prevent="navigateFromHome(); $event.target.querySelector('input').blur()">
            <input type="text" x-model="homeSearchInput" placeholder="Search the web or enter an address..." autofocus />
          </form>
        </div>

        <div class="quick-apps-section">
          <div class="section-header">
            <button class="edit-btn" @click="isEditingBookmarks = !isEditingBookmarks" x-text="isEditingBookmarks ? 'Done Editing' : 'Edit Shortcuts'"></button>
          </div>
          <div class="quick-apps-grid">
            <template x-for="bm in bookmarks" :key="bm.id">
              <div class="app-card" @click="!isEditingBookmarks && (bm.url.startsWith('/') ? window.location.href = bm.url : navigateBookmark(bm.url))">
                <div class="app-icon">
                  <img :src="bm.icon || `https://www.google.com/s2/favicons?domain=${bm.url}&sz=64`" :alt="bm.name" onerror="this.onerror=null;this.src='mathpunch.jpeg'" />
                </div>
                <span class="app-name" x-text="bm.name"></span>
                <div class="card-actions" x-show="isEditingBookmarks">
                  <div class="action-btn" @click.stop="editBookmark(bm)">✎</div>
                  <div class="action-btn" @click.stop="removeBookmark(bm.id)">×</div>
                </div>
              </div>
            </template>
            <div class="app-card add-card" x-show="isEditingBookmarks" @click="openAddModal()">
              <div class="app-icon">+</div>
              <span class="app-name">Add Shortcut</span>
            </div>
          </div>
        </div>

        <button class="aboutblank-btn" @click="openInAboutBlank()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Open in about:blank
        </button>

        <div class="recent-section" x-show="recentSites.length > 0">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3>Recent Sites</h3>
            <button class="edit-btn" style="padding:0;" @click="clearRecent()">Clear History</button>
          </div>
          <div class="recent-list">
            <template x-for="(site, index) in recentSites.slice(0, 5)" :key="index">
              <div class="recent-item" @click="navigateBookmark(site.url)">
                <img class="recent-favicon" :src="`https://www.google.com/s2/favicons?domain=${site.url}&sz=32`" onerror="this.onerror=null;this.style.opacity='0'" />
                <div class="recent-info">
                  <div class="recent-title" x-text="site.title || site.url"></div>
                  <div class="recent-url" x-text="site.url"></div>
                </div>
                <div class="recent-remove" @click.stop="removeRecent(index)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" x-show="showBookmarkModal" x-transition.opacity style="display: none">
      <div class="modal" @click.away="showBookmarkModal = false">
        <h4 x-text="bookmarkForm.id ? 'Edit Shortcut' : 'Add Shortcut'"></h4>
        <div class="form-group">
          <label>Name</label>
          <input type="text" x-model="bookmarkForm.name" placeholder="e.g. YouTube" />
        </div>
        <div class="form-group">
          <label>URL</label>
          <input type="text" x-model="bookmarkForm.url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label>Icon URL (Optional)</label>
          <input type="text" x-model="bookmarkForm.icon" placeholder="https://.../favicon.png" />
        </div>
        <div class="modal-footer">
          <button class="btn btn-cancel" @click="showBookmarkModal = false">Cancel</button>
          <button class="btn btn-save" @click="saveBookmark()">Save</button>
        </div>
      </div>
    </div>

    <script>
      function mathApp() {
        return {
          canvas: null,
          ready: false,
          error: null,
          initError: null,
          loadingStatus: 'Starting browser...',
          tabs: [],
          activeTabId: null,
          currentUrlInput: '',
          homeSearchInput: '',
          tabTransitioning: false,
          recentSites: [],
          bookmarks: [],
          isEditingBookmarks: false,
          showBookmarkModal: false,
          bookmarkForm: { id: null, name: '', url: '', icon: '' },

          get activeTab() { return this.tabs.find((t) => t.id === this.activeTabId) },
          get isLoading() { return this.activeTab ? this.activeTab.loading : false },
          get showNewTabUI() {
            if (!this.activeTab) return true
            return !this.activeTab.url || this.activeTab.url === 'about:blank' || this.activeTab.url.includes('/newtab.html')
          },

          forceReady() { this.ready = true },

          async init() {
            const timeout = setTimeout(() => {
              if (!this.ready) this.initError = 'Initialization timed out. The proxy files may be missing or blocked.'
            }, 8000)

            const defaults = [
              { id: 2, name: 'GitHub',      url: 'https://github.com' },
              { id: 3, name: 'CrazyGames',  url: 'https://crazygames.com' },
              { id: 6, name: 'Granite',     url: 'https://seabean.hollands.id.au/granite.html' },
              { id: 7, name: 'Shuttlemath', url: 'https://shuttlemath.com' },
              { id: 8, name: 'nowgg',       url: 'https://nowgg.fun' },
            ]

            const savedBookmarks = localStorage.getItem('seabean_bookmarks')
            if (savedBookmarks) {
              try {
                this.bookmarks = JSON.parse(savedBookmarks)
                  .filter(bm => ![1, 4, 5].includes(bm.id))
                  .map((bm) => {
                    if (bm.icon && bm.icon.includes('google.com/s2/favicons?domain=about:blank')) bm.icon = ''
                    const defaultBm = defaults.find((d) => d.id === bm.id)
                    if (defaultBm) return { ...bm, ...defaultBm }
                    return bm
                  })
                this.saveToStorage()
              } catch {
                this.bookmarks = defaults
                this.saveToStorage()
              }
            } else {
              this.bookmarks = defaults
              this.saveToStorage()
            }

            try {
              const savedRecent = localStorage.getItem('seabean_recent_sites')
              if (savedRecent) this.recentSites = JSON.parse(savedRecent)
            } catch { this.recentSites = [] }

            let SuCanvas, SuClient
            try {
              this.loadingStatus = 'Loading proxy engine...'
              const clientModule = await import('./su-client.js')
              const canvasModule = await import('./su-canvas.js')
              SuClient = clientModule.SuClient || window.SuClient
              SuCanvas = canvasModule.SuCanvas || window.SuCanvas
              if (!SuClient || !SuCanvas) throw new Error('SuClient or SuCanvas export missing')
            } catch (e) {
              clearTimeout(timeout)
              this.initError = 'Failed to load proxy files (su-canvas.js / su-client.js): ' + e.message
              return
            }

            try {
              this.loadingStatus = 'Starting proxy...'
              this.canvas = new SuCanvas('canvas-container')
            } catch (e) {
              clearTimeout(timeout)
              this.initError = 'Failed to initialize SuCanvas: ' + e.message
              return
            }

            this.canvas.on(SuCanvas.EVENTS.SURFACE_CREATED, () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.SURFACE_CLOSED,  () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.SURFACE_CHANGE, (s) => {
              this.activeTabId = s ? s.id : null
              if (s) this.updateFromSurface(s); else this.currentUrlInput = ''
            })
            this.canvas.on(SuCanvas.EVENTS.URL_CHANGE, (data) => {
              this.currentUrlInput = (data.decoded.includes('/newtab.html') || data.decoded === 'about:blank') ? '' : data.decoded
              this.refreshTabs()
            })
            this.canvas.on(SuCanvas.EVENTS.TITLE_CHANGE, () => {
              this.refreshTabs()
              const tab = this.activeTab
              if (tab && tab.url && tab.url !== 'about:blank' && !tab.url.includes('/newtab.html') && tab.title && tab.title !== 'New Tab') {
                this.addToRecent({ url: tab.url, title: tab.title })
              }
            })
            this.canvas.on(SuCanvas.EVENTS.FAVICON_CHANGE,  () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.LOADING_START,   () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.LOADING_STOP,    () => this.refreshTabs())
            this.canvas.on(SuCanvas.EVENTS.READY, () => { clearTimeout(timeout); this.initError = null; this.ready = true })
            this.canvas.on(SuCanvas.EVENTS.ERROR, (e) => console.error('SuCanvas error:', e))

            try { this.addTab() } catch (e) {
              clearTimeout(timeout)
              this.initError = 'Failed to create initial tab: ' + e.message
            }
          },

          updateFromSurface(surface) {
            if (surface.client) {
              const decoded = surface.client.decode(surface.client._lastUrl || '')
              this.currentUrlInput = decoded === 'about:blank' ? '' : decoded
            }
          },

          refreshTabs() {
            this.tabs = Array.from(this.canvas.surfaces.values()).map((s) => {
              const client = s.client
              const rawUrl = client ? client._lastUrl || '' : ''
              const decoded = client ? client.decode(rawUrl) : ''
              return { id: s.id, title: s.title, favicon: s.favicon, loading: client ? client.getState().loading : false, url: decoded }
            })
            if (this.activeTab) {
              document.title = this.activeTab.title && this.activeTab.title !== 'New Tab'
                ? `${this.activeTab.title} - Sea Bean`
                : 'Sea Bean'
            }
          },

          saveToStorage() { localStorage.setItem('seabean_bookmarks', JSON.stringify(this.bookmarks)) },
          addTab()        { const id = this.canvas.createSurface(); this.canvas.switchSurface(id) },
          closeTab(id)    { this.canvas.closeSurface(id) },

          activateTab(id) {
            if (id === this.activeTabId) return
            this.tabTransitioning = true
            setTimeout(() => { this.canvas.switchSurface(id); setTimeout(() => { this.tabTransitioning = false }, 150) }, 150)
          },

          navigate()         { if (!this.currentUrlInput) return; this.canvas.navigate(this.currentUrlInput) },
          navigateFromHome() { if (!this.homeSearchInput) return; this.canvas.navigate(this.homeSearchInput); this.homeSearchInput = '' },
          navigateBookmark(url) { this.currentUrlInput = url; this.navigate() },
          reloadTab()        { this.canvas.reload() },
          goBack()           { this.canvas.goBack() },
          goForward()        { this.canvas.goForward() },

          addToRecent(site) {
            this.recentSites = this.recentSites.filter(s => s.url !== site.url)
            this.recentSites.unshift(site)
            if (this.recentSites.length > 10) this.recentSites = this.recentSites.slice(0, 10)
            localStorage.setItem('seabean_recent_sites', JSON.stringify(this.recentSites))
          },
          removeRecent(index) {
            this.recentSites.splice(index, 1)
            localStorage.setItem('seabean_recent_sites', JSON.stringify(this.recentSites))
          },
          clearRecent() { this.recentSites = []; localStorage.removeItem('seabean_recent_sites') },

          openInAboutBlank() {
            const win = window.open('about:blank', '_blank')
            if (!win) { alert('Popup blocked! Please allow popups for this site.'); return }
            win.document.title = 'Sea Bean'
            const iframe = win.document.createElement('iframe')
            iframe.style = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;'
            iframe.src = window.location.href
            win.document.body.style = 'margin:0;padding:0;overflow:hidden;'
            win.document.body.appendChild(iframe)
          },

          openAddModal()    { this.bookmarkForm = { id: null, name: '', url: '', icon: '' }; this.showBookmarkModal = true },
          editBookmark(bm)  { this.bookmarkForm = { ...bm }; this.showBookmarkModal = true },
          removeBookmark(id){ this.bookmarks = this.bookmarks.filter((b) => b.id !== id); this.saveToStorage() },

          saveBookmark() {
            if (!this.bookmarkForm.name || !this.bookmarkForm.url) return
            if (this.bookmarkForm.id) {
              const idx = this.bookmarks.findIndex((b) => b.id === this.bookmarkForm.id)
              this.bookmarks[idx] = { ...this.bookmarkForm }
            } else {
              this.bookmarks.push({ ...this.bookmarkForm, id: Date.now() })
            }
            this.saveToStorage()
            this.showBookmarkModal = false
          },
        }
      }
    </script>
  </body>
</html>
